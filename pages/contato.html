<link rel="stylesheet" href="css/contato.css">
<main class="contact">

    <h2 class="title">Entre em contato comigo:</h2>
    <p>Sinta-se livre para me dar um feedback me enviando uma mensagem pelo formulário abaixo.</p>
    <form action="https://formsubmit.co/7a4acdb8e7d2572f0f56fa80343160e3" method="post">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" required placeholder="Qual seu nome?">
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required placeholder="seu_melhor_email@mail.com">
        <label for="assunto">Assunto:</label>
        <input type="text" name="assunto" id="assunto" required>
        <label for="mensagem">Mensagem:</label>
        <textarea name="mensagem" id="mensagem" rows="5" required></textarea>
        <button type="submit">Enviar</button>


    </form>
</main>
